// XP по GDD: floor(sum floor(i+300*2^(i/7)))/4  → 99 ≈ 3.26M xp
const XP_TABLE = (()=>{const t=[0,0];let p=0;for(let L=1;L<100;L++){p+=Math.floor(L+300*Math.pow(2,L/7));t[L+1]=Math.floor(p/4);}return t;})();
// t[L] = xp для уровня L
function levelFromXp(xp){let l=1;while(l<99&&xp>=XP_TABLE[l+1])l++;return l;}

function buildCost(id,lvl){ // стоимость перехода lvl→lvl+1
  const t=Math.min(6,Math.floor(lvl*0.7));const k=Math.pow(1.6,lvl);
  const c=[['gold',Math.floor(150*k)]];
  c.push(['plank'+t,Math.floor(4+lvl*3)]);
  c.push(['bar'+t,Math.floor(3+lvl*2.5)]);
  if(lvl>=4)c.push(['gem'+Math.min(4,lvl-4),Math.floor(1+lvl/3)]);
  if(id==='soul')c.push(['tear',1+lvl]);
  return c;
}

function rnd(){ // детерминированный mulberry32, состояние в сейве
  let t=(S.rng=(S.rng+0x6D2B79F5)|0);
  t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);
  return((t^(t>>>14))>>>0)/4294967296;
}
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>{n=Math.floor(n);if(n<1e4)return''+n;if(n<1e6)return(n/1e3).toFixed(n<1e5?1:0)+'K';if(n<1e9)return(n/1e6).toFixed(2)+'M';return(n/1e9).toFixed(2)+'B';};
const fmtT=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60;return h?`${h}ч ${m}м`:m?`${m}м ${c}с`:`${c}с`;};

// ---------- модификаторы ----------
function addMod(o,k,v){if(k==='skillLv')return;o[k]=(o[k]||0)+v;}
function recalcMods(){
  const m={skill:{}};
  const F=S.challenge?CHALLENGES.find(c=>c.id===S.challenge.id).f:{};
  m.F=F;
  let worn=0;
  for(const sl of SLOTS){const it=S.eq[sl];if(!it)continue;worn++;
    if(F.ascetic&&worn>4)continue;
    for(const a of it.aff||[]){ if(a.k==='skillLv')m.skill[a.s]=(m.skill[a.s]||0)+a.v; else addMod(m,a.k,a.v);}
    if(it.leg)addMod(m,it.leg.k,it.leg.v);
    if(it.u){const u=UNQ[it.u];for(const k in u.mods){ if(k==='xpPrayer'){m.xpSk=m.xpSk||{};m.xpSk.prayer=(m.xpSk.prayer||0)+u.mods[k];} else addMod(m,k,u.mods[k]);} if(u.ability)(m.uAbil=m.uAbil||[]).push(u.ability);}
  }
  for(const n of ECHO_NODES){if(!S.echoT[n.id])continue; if(n.k==='unlock')m[n.v]=1; else addMod(m,n.k,n.v);}
  for(const cid in S.chDone){const c=CHALLENGES.find(x=>x.id===cid);if(c)for(const k in c.rw)addMod(m,k,c.rw[k]);}
  const T=S.town;
  addMod(m,'craftSpeedSmith',(T.forge||0)*5); addMod(m,'offlineH',(T.tavern||0)*1.2);
  addMod(m,'combatXp',(T.library||0)*2); addMod(m,'potPct',(T.lab||0)*5); addMod(m,'prayerXp',(T.temple||0)*5);
  addMod(m,'goldPct',(T.guild||0)*10); addMod(m,'eliteLoot',(T.observ||0)*5); addMod(m,'echoPct',(T.soul||0)*8);
  // перки и мастерство
  m.psk={};for(const s2 of SKILLS){const P=(m.psk[s2.id]={});const G=PERK_G[perkGroup(s2.id)];
    PERK_LV.forEach((L,i)=>{const ch=S.perks[s2.id+'_'+i];if(ch===undefined)return;const o=G[i][ch];for(const k in o){if(k==='d')continue;if(k==='g'){for(const gk in o.g)addMod(m,gk,o.g[gk]);}else P[k]=(P[k]||0)+o[k];}});
    const ml=mastery(s2.id);if(ml){const g=perkGroup(s2.id);if(g==='gather'||g==='craft')P.sp=(P.sp||0)+ml;else if(g==='combat')addMod(m,'dmgPct',ml*0.5);else if(g==='prayer')addMod(m,'faithGain',ml);else P.famdmg=(P.famdmg||0)+ml;}}
  // фамильяр
  if(S.fam&&S.fam.until>S.gameMs){const e=FAM[S.fam.id].e;if(e.gather)addMod(m,'gatherSpeed',e.gather);if(e.craft)addMod(m,'craftSpeed',e.craft);if(e.drop)addMod(m,'dropPct',e.drop);}
  // вознесение / трансценденция
  addMod(m,'xpPct',S.asc*5+S.trans*15); addMod(m,'dmgPct',S.asc*3+S.trans*10); addMod(m,'hpPct',S.asc*3+S.trans*10);
  if(S.ng){addMod(m,'dropPct',S.ng*25);addMod(m,'goldPct',S.ng*25);}
  // баффы
  for(const k in S.buffs){const b=S.buffs[k];if(b.until>S.gameMs){if(k==='resAll')addMod(m,'resAll',b.v);else addMod(m,k,b.v);} else delete S.buffs[k];}
  if(F.glass)m.glass=1;
  M=m;
}

// ---------- боевые статы игрока ----------
function weaponType(){const w=S.eq.weapon;return w?w.wt:'fist';}
function styleSkill(){
  const wt=weaponType();
  if(wt==='bow')return 'ranged'; if(wt==='staff')return 'magic';
  return S.style==='strength'||S.style==='defense'?S.style:'attack';
}
function playerStats(){
  const F=M.F||{};
  const a=effLv('attack'),s=effLv('strength'),d=effLv('defense'),r=effLv('ranged'),mg=effLv('magic'),p=effLv('prayer');
  const w=S.eq.weapon; const wt=weaponType();
  let base,spd,dmgSk;
  if(w){const W=WEAP[wt];base=w.dmg;spd=W.spd;dmgSk=W.sk;} else {base=4;spd=2200;dmgSk='attack';}
  let dmg;
  if(dmgSk==='attack') dmg=(base+a*0.55)*(1+s/60);
  else if(dmgSk==='ranged') dmg=(base+r*0.6)*(1+r/90);
  else dmg=(base+mg*0.6)*(1+mg/80)*(1+(M.magicPct||0)/100);
  if(dmgSk==='attack'&&M.magicToMelee) dmg+=mg*0.6*M.magicToMelee/100;
  dmg+= (M.flatDmg||0);
  let dmgPct=(M.dmgPct||0)+(S.buffs.dmgPct&&S.buffs.dmgPct.until>S.gameMs?0:0);
  dmg*=1+dmgPct/100;
  if(F.onlyMagic&&dmgSk!=='magic')dmg*=0.05; if(F.onlyRanged&&dmgSk!=='ranged')dmg*=0.05;
  if(M.glass)dmg*=2;
  let armor=0;for(const sl of SLOTS){const it=S.eq[sl];if(it&&it.arm)armor+=it.arm;}
  armor=(armor+d*1.5)*(1+(M.armorPct||0)/100); if(F.noArmor)armor=0;
  let hp=(50+d*6+s*4+(M.hp||0))*(1+(M.hpPct||0)/100); if(M.glass)hp/=2; hp=Math.max(20,hp);
  const mana=40+mg*4+(M.mana||0)+(wt==='staff'?20:0);
  const speed=Math.max(400,spd/(1+(M.speedPct||0)/100));
  const crit=clamp(5+r/10+(M.critPct||0)+(WEAP[wt]&&WEAP[wt].crit||0),0,85);
  const res={}; for(const e of ['Fire','Ice','Shock','Poison','Dark'])res[e.toLowerCase()]=clamp((M['res'+e]||0)+(M.resAll||0),-50,75);
  return {dmg:Math.max(1,dmg),speed,armor,hp:Math.floor(hp),mana:Math.floor(mana),crit,critMult:2+(M.critMult||0)/100,res,dmgSk,regen:(M.regen||0)+p*0.02,wt};
}

// ---------- предметы ----------
function tierOf(ilvl){return clamp(Math.floor((ilvl-1)/14),0,6);}
function makeItem(slot,wt,ilvl,rarity,src){
  // slot: weapon/shield/head/... ring (без 1/2)
  if(slot==='weapon'&&!wt)wt=pick(['sword','sword','dagger','bow','staff']);
  const it={uid:S.uid++,slot,wt:wt||null,ilvl,r:rarity,aff:[],q:0};
  const bk=slot==='weapon'?wt:slot;
  const t=tierOf(ilvl);
  let gen=src==='craft'?(wt==='bow'||wt==='staff'||slot==='cloak'?WOOD_GEN[t]:METAL_GEN[t]):DROP_GEN[clamp(Math.floor((ilvl-1)/10),0,9)];
  if(slot==='ring'||slot==='amulet')gen=src==='craft'?'':DROP_GEN[clamp(Math.floor((ilvl-1)/10),0,9)];
  it.n=(BASE_N[bk]+' '+gen).trim();
  if(slot==='weapon'){const W=WEAP[wt];it.dmg=+(W.b+ilvl*W.k).toFixed(1);}
  if(ARMOR_K[slot])it.arm=+(1+ilvl*ARMOR_K[slot]).toFixed(1);
  if(slot==='belt')it.aff.push({k:'hp',v:Math.floor(5+ilvl*1.2)});
  it.req=ilvl<=10?1:Math.floor(ilvl*0.8);
  it.rsk=slot==='weapon'?WEAP[wt].sk:(['ring','amulet','cloak','belt'].includes(slot)?null:'defense');
  const R=RARITY[rarity];
  let na=ri(R.aff[0],R.aff[1]); if((slot==='ring'||slot==='amulet')&&na<1)na=1;
  for(let i=0;i<na;i++)addAffix(it);
  if(rarity===4)it.leg=Object.assign({},pick(LEG_EFFECTS));
  // качество от навыка кузнеца
  if(src==='craft'){it.q=clamp(Math.floor(lv('smith')/10+rnd()*10),0,20);if(it.dmg)it.dmg=+(it.dmg*(1+it.q/100)).toFixed(1);if(it.arm)it.arm=+(it.arm*(1+it.q/100)).toFixed(1);}
  S.j.items[bk+'_'+t]=1; S.st.found[rarity]++;
  return it;
}
function makeUnique(uid,ilvl){
  const u=UNQ[uid];const wt=u.wt||null;
  const it={uid:S.uid++,slot:u.slot,wt,ilvl,r:5,aff:[],u:uid,n:u.n,q:0};
  if(u.slot==='weapon'){const W=WEAP[wt];it.dmg=+(W.b+ilvl*W.k*1.15).toFixed(1);}
  if(ARMOR_K[u.slot])it.arm=+(1+ilvl*ARMOR_K[u.slot]*1.15).toFixed(1);
  it.req=Math.max(1,Math.floor(ilvl*0.7));
  it.rsk=u.slot==='weapon'?WEAP[wt].sk:(['ring','amulet','cloak','belt'].includes(u.slot)?null:'defense');
  S.j.items['u:'+uid]=1;S.st.found[5]++; if(u.ultra)S.st.found[6]++;
  return it;
}
function addAffix(it){
  const used=new Set(it.aff.map(a=>a.k));
  let pool=AFF_KEYS.filter(k=>!used.has(k)||k==='skillLv');
  if(it.slot!=='weapon')pool=pool.filter(k=>k!=='flatDmg'||rnd()<0.3);
  const k=pick(pool);const A=AFFIX[k];
  const f=clamp(it.ilvl/100,0.05,1.2)*(0.5+rnd()*0.6);
  let v=A.min+(A.max-A.min)*f; v=A.f?+v.toFixed(1):Math.max(A.min,Math.round(v));

  for(const k in base.set)if(s.set[k]===undefined)s.set[k]=base.set[k];
  for(const sk of SKILLS)if(s.skills[sk.id]===undefined)s.skills[sk.id]=0;
  for(const b of BUILDINGS)if(s.town[b.id]===undefined)s.town[b.id]=0;
  if(Object.keys(s.echoT||{}).some(k=>k[0]==='e')){let ref=0;for(const k in s.echoT){if(k[0]==='e'){const i=+k.split('_')[1];ref+=[1,3,8,20,50][i]||0;}}s.echo+=ref;s.echoT={};s.log.unshift({t:'Дерево Эха перестроено: возвращено '+ref+' Эха',at:Date.now()});}

}

  if(P.eff.heal&&S.cb){const st=S.cb.st||playerStats();const h=st.hp*P.eff.heal*k;S.cb.php=Math.min(st.hp,S.cb.php+h);fx('p','+'+Math.floor(h),'#5c5');}
  if(P.eff.buff){S.buffs[P.eff.buff]={v:Math.round(P.eff.v*k),until:S.gameMs+P.eff.dur*1000};recalcMods();toast(P.n+': '+fmtT(P.eff.dur));}
  sfx('drink');return true;
}

// ---------- урон по игроку ----------
function hurtPlayer(e,raw,heavy){
  const c=S.cb,st=c.st;
  let d=raw;
  if(S.fam&&S.fam.until>S.gameMs&&FAM[S.fam.id].e.absorb)d*=1-FAM[S.fam.id].e.absorb/100;
  if(e.mech==='guard'&&heavy)c.pst.stun={t:1.2};
  if(e.mech==='gardener')c.pst.bleed={t:4,dps:raw*0.12};
  if(e.mech==='corruption'){const p0=c.pst.poison;c.pst.poison={t:6,dps:Math.min(raw*0.3,(p0?p0.dps:0)+raw*0.05)};}
  const dr=st.armor/(st.armor+120+8*e.lvl);
  if(e.el==='phys')d*=1-dr; else d*=(1-(st.res[e.el]||0)/100)*(1-dr*0.6);
  if(c.pb.drPct)d*=1-c.pb.drPct.v/100;
  d=Math.max(1,d);
  if(c.shield>0){const a=Math.min(c.shield,d);c.shield-=a;d-=a;}
  c.php-=d; fx('p','-'+Math.floor(d),heavy?'#f44':'#d88');
  const th=(M.thorns||0)+(c.pb.thorns?c.pb.thorns.v:0); if(th>0&&e.hp>0){e.hp-=raw*th/100;}
  if(e.st&&rnd()<0.2){const dps={burn:0.15,bleed:0.12,poison:0.12}[e.st]*raw;c.pst[e.st]={t:4,dps};}
  if(heavy&&rnd()<0.3)c.pst.stun={t:1};
  vfx('phurt',{heavy});sfx(heavy?'heavy':'hurt');
}

function enemyAct(e,dt){
  if(e.hp<=0)return;
  const c=S.cb;
  if(e.mech)bossMech(e,dt);
  if(e.sts.stun){return;}
  const slow=e.sts.slow?0.6:1;
  if(e.tele>0){e.tele-=dt; if(e.tele<=0){ if(!e.dodged){vfx('eatk',{arch:e.arch,el:e.el});hurtPlayer(e,e.dmg*2.2,true);} e.tele=0;e.dodged=false;} return;}
  e.t-=dt*slow;
  if(e.t<=0){e.t=e.spd;
    e.heavyIn--;
    if(e.heavyIn<=0){e.tele=TELE_MS*(1+(M.dodgeWindow||0)/100);e.dodged=false;e.heavyIn=e.phase>=2?2:e.mech==='eye'?3:ri(3,5);
      if(!OFFLINE_RUN&&!c.active){/* в пассивном режиме уклонение не работает */}
    } else {vfx('eatk',{arch:e.arch,el:e.el});hurtPlayer(e,e.dmg,false);}
  }
}
function bossMech(e,dt){
  const c=S.cb;e.mt+=dt;if(e.inv>0)e.inv-=dt;
  const every=(ms,k)=>{e['m_'+k]=(e['m_'+k]||0)+dt;if(e['m_'+k]>=ms){e['m_'+k]=0;return true;}return false;};
  switch(e.mech){
    case 'dryad':if(every(12000,'a')&&c.adds.length<2){c.adds.push(makeEnemy('Уголёк','beast',Math.max(1,e.lvl-8-S.ng*12),'add'));fx('e','Угольки!','#f80');}break;
    case 'king':if(every(10000,'a')){const h=e.maxhp*0.04;e.hp=Math.min(e.maxhp,e.hp+h);fx('e','+'+Math.floor(h),'#5c5');}break;
    case 'bishop':if(every(9000,'a')){c.pdeb=c.pdeb||{};c.pdeb.weak={t:6};fx('p','Проклятие','#b060d0');}break;
    case 'serpent':{const st=c.st;c.php-=st.hp*0.008*(1-(st.res.fire||0)/100)*dt/1000;break;}
    case 'frost':if(every(10000,'a')){c.pdeb=c.pdeb||{};c.pdeb.freeze={t:4};fx('p','Заморожен','#8fd0ff');}break;
    case 'herald':if(every(15000,'a')){e.inv=3000;fx('e','Неуязвим','#c8b0ff');}break;
    case 'flesh':e.hp=Math.min(e.maxhp,e.hp+e.maxhp*0.004*dt/1000);break;
    case 'alpha':if(!e.fast){e.fast=1;e.spd*=0.7;}break;
  }
}
function tickStatuses(e,dt){
  const s=dt/1000;
  for(const k in e.sts){const x=e.sts[k];if(x.dps){e.hp-=x.dps*s;} x.t-=s;if(x.t<=0)delete e.sts[k];}
}
function bossPhases(e){
  const c=S.cb; if(!['boss','final','dboss','eboss'].includes(e.kind))return;
  if(e.phase===1&&e.hp<e.maxhp*0.66){e.phase=2;vfx('phase');fx('e','Фаза II','#f80');toast(e.name+': огненный дождь!');}
  if(e.phase===2&&e.hp<e.maxhp*0.33){e.phase=3;vfx('phase');e.dmg*=1.3;fx('e','Фаза III','#f44');
    for(let i=0;i<2;i++){const A=Object.keys(ARCH);c.adds.push(makeEnemy('Порождение','beast',Math.max(1,e.lvl-5-S.ng*12-((M.F||{}).enemyLv||0)),'add'));}
    toast(e.name+' призывает подмогу!');}
  if(S.ng>0&&e.phase===3&&e.hp<e.maxhp*0.15){e.phase=4;vfx('phase');e.dmg*=1.3;e.spd*=0.75;e.hp+=e.maxhp*0.2;fx('e','Фаза IV','#f0f');toast(e.name+': истинная форма!');}
}

function combatTick(dt){
  const c=S.cb; if(!c)return;
  if(c.dead){c.deadT-=dt;if(c.deadT<=0){stopCombat();S.cb=null;}return;}
  c.st=playerStats();
  const st=c.st,F=M.F||{},s=dt/1000;
  if(c.respawn>0){c.respawn-=dt;if(c.respawn<=0)spawnEnemy();regenPlayer(s*3);return;}
  if(!c.en){spawnEnemy();return;}
  if(c.dg){c.dg.t+=dt;if(c.dg.t>15*60e3){toast('Время данжа вышло!');log('Данж провален: время вышло');stopCombat();S.cb=null;return;}}
  // ресурсы
  c.mana=Math.min(st.mana,c.mana+s*(2+effLv('magic')*0.05)*Math.max(0,1+(M.manaRegenMult||0)/100));
  c.faith=Math.min(100,c.faith+s*(0.5+effLv('prayer')*0.03)*(1+(M.faithGain||0)/100));
  regenPlayer(s);
  if(M.hpDrain)c.php-=st.hp*0.004*s; if(F.ashDrain)c.php-=st.hp*0.008*s;
  for(const k in c.cds){c.cds[k]-=s;if(c.cds[k]<=0)delete c.cds[k];}
  for(const k in c.pb){c.pb[k].t-=s;if(c.pb[k].t<=0)delete c.pb[k];}
  if(c.pb.aura)c.php=Math.min(st.hp,c.php+st.hp*0.01*s);
  for(const k in c.pst){const x=c.pst[k];if(x.dps)c.php-=x.dps*s;x.t-=s;if(x.t<=0)delete c.pst[k];}
  c.eatCd=Math.max(0,c.eatCd-s);
  // авто-еда / зелье
  if(c.php<st.hp*0.45)eatFood();
  if(M.autoPotion&&c.php<st.hp*0.25&&S.potion&&RES[S.potion]&&RES[S.potion].pot.eff.heal)drinkPotion();
  // авто-способности
  c.autoT=(c.autoT||0)-dt; if(c.autoT<=0){c.autoT=400;autoAbilities();if(S.cb!==c||!c.en)return;}
  // атака игрока
  if(c.pdeb)for(const k in c.pdeb){c.pdeb[k].t-=s;if(c.pdeb[k].t<=0)delete c.pdeb[k];}
  if(!c.pst.stun){c.pt-=dt*(c.pdeb&&c.pdeb.freeze?0.5:1); if(c.pt<=0){c.pt=st.speed;playerAttack();}}
  // враги
  for(const e of [c.en,...c.adds]){tickStatuses(e,dt);enemyAct(e,dt);}
  bossPhases(c.en);
  checkDeaths();
}
function regenPlayer(s){const c=S.cb;c.php=Math.min(c.st.hp,c.php+c.st.regen*s+c.st.hp*0.003*s+(c.respawn>0?c.st.hp*0.03*s:0));}

function checkDeaths(){
  const c=S.cb; if(!c)return;
  c.adds=c.adds.filter(a=>a.hp>0);
  if(c.en&&c.en.hp<=0){killEnemy(c.en);}
  if(S.cb&&S.cb.php<=0&&!S.cb.dead)playerDied();
}
function playerDied(){
  const c=S.cb,F=M.F||{};
  if(S.fam&&S.fam.until>S.gameMs&&FAM[S.fam.id].e.revive&&S.fam.rev){S.fam.rev=0;c.php=c.st.hp*0.5;fx('p','Феникс!','#ff8040');vfx('heal');return;}
  if(OFFLINE_RUN){c.php=1;stopCombat();OFF.stoppedByDeath=true;return;}
  S.st.deaths++; sfx('death');vfx('pdie');
  if(combatHooks.onDeath)combatHooks.onDeath(c);
  if(F.noDeath&&S.challenge){failChallenge('Смерть');return;}
  log('Ты пал: '+(c.en?c.en.name:'')+'. Пепел возвращает тебя в Очаг.');
  c.dead=1;c.deadT=1800;c.php=0;
}

// ---------- награды ----------
function killEnemy(e){
  const c=S.cb,L=c.layer||1,st=c.st;
  vfx('death',{spr:V.pos.espr,big:['boss','elite','final','dboss','eboss','mini','mimic'].includes(e.kind)});
  S.st.kills++; S.j.mobs[e.name]=(S.j.mobs[e.name]||0)+1;
  // опыт
  let xp=e.lvl*5*({boss:6,elite:4,final:10,dwave:1.5,dboss:8,mini:3,eboss:6,mimic:3}[e.kind]||1);
  const sk=styleSkill();
  gainXp(sk,xp); if(sk==='ranged'||sk==='magic')gainXp('defense',xp*0.33);
  if(sk==='attack'||sk==='strength')gainXp('defense',xp*0.1);
  // золото и ресурсы
  gainGold((1.2+e.lvl*0.5)*(0.7+rnd()*0.6)*({boss:8,elite:6,final:20,dboss:10,mini:4,eboss:8,mimic:15}[e.kind]||1));
  addRes(L<=3?'bones0':L<=7?'bones1':'bones2',e.kind==='normal'||e.kind==='dwave'?1:3);
  if(rnd()<0.6)addRes('dust',1+Math.floor(L/2));
  const big=['boss','elite','final','dboss','eboss'].includes(e.kind);const semi=e.kind==='mini'||e.kind==='mimic';
  if(big){addRes('dust',10*L);addRes('tear',e.kind==='elite'?(rnd()<0.3?1:0):ri(1,2+Math.floor(L/4)));}
  // предметы
  const F=M.F||{};
  let ch=(e.kind==='normal'||e.kind==='dwave'?0.035:1)*(1+(M.dropPct||0)/100)*(F.lowDrop?0.3:1);
  const ilvl=Math.max(1,e.lvl);
  let rb=(M.dropPct||0)+(M.rarBonus||0)+(e.kind==='elite'?300+(M.eliteLoot||0):0)+(big?100:0)+(semi?150:0);
  const drops=big?(e.kind==='final'?3:e.kind==='dboss'?2:1):e.kind==='mimic'?2:e.kind==='mini'?(rnd()<0.5?1:0):(rnd()<ch?1:0);
  if(e.kind==='mini'&&!OFFLINE_RUN)bigToast('Вожак повержен!');
  if(e.kind==='mimic'){addRes('gem'+clamp(Math.floor(L/2.2),0,4),1);S.crystals+=2;if(!OFFLINE_RUN)bigToast('Мимик вскрыт!');}
  for(let i=0;i<drops;i++)dropGear(ilvl,rb,L);
  // сверхредкость 1 из 100 000
  if(!OFFLINE_RUN&&rnd()<0.00001*(1+(M.dropPct||0)/100)*(big?20:1)){const u=pick(UNIQUES.filter(u=>u.ultra));const it=makeUnique(u.id,ilvl+5);giveItem(it);bigToast('✦ СВЕРХРЕДКОСТЬ ✦ '+u.n);}
  // записки
  if(rnd()<(big?0.25:0.006)*(1+(M.dropPct||0)/200))dropNote(L);
  // самоцветы
  if(rnd()<(big?0.5:0.01))addRes('gem'+clamp(Math.floor(L/2.2),0,4),1);
  questEvent('kill',{layer:L,kind:e.kind});
  if(combatHooks.onKill)combatHooks.onKill(e);
  // особые случаи
  if(e.kind==='boss'){
    if(!S.bosses[L])S.marks+=3;
    if(!S.storySeen['post'+L]&&storyHook&&!OFFLINE_RUN&&L<10){S.storySeen['post'+L]=1;storyHook(L,'post');}
    S.bosses[L]=(S.bosses[L]||0)+1; if(S.unlockedLayer<=L&&L<10)S.unlockedLayer=L+1;
    if(rnd()<0.35)addRes('key'+L,1);
    log('Повержен босс: '+e.name+'!');
    checkChallengeGoal(L);
    if(L===10){c.kind='final';c.stage=0;c.respawn=2500;c.en=null;toast('Глубже… Сердце зовёт.');return;}
  }
  if(e.kind==='final'){
    if(c.stage<2){c.stage++;c.respawn=3000;c.en=null;c.php=Math.min(c.st.hp,c.php+c.st.hp*0.3);c.pst={};toast('Это ещё не конец…');return;}
    stopCombat();S.cb=null; if(combatHooks.onEnding&&!OFFLINE_RUN)combatHooks.onEnding(); return;
  }
  if(e.kind==='elite'){S.ev.killedElite[L]=eliteSlot();S.st.elites++;addRes('dust',20);S.crystals+=3+L;log('Элита повержена: '+e.name);stopCombat();S.cb=null;return;}
  if(e.kind==='dwave'){c.dg.wave++;c.respawn=800;c.en=null;return;}
  if(e.kind==='dboss'){finishDungeon();return;}
  if(e.endless){c.fk++;if(e.kind==='eboss'){S.endless.depth++;S.endless.best=Math.max(S.endless.best,S.endless.depth);c.fk=0;S.crystals+=2+Math.floor(S.endless.depth/5);if(!OFFLINE_RUN)bigToast('Глубина '+S.endless.depth);}}
  if(e.kind==='normal'||e.kind==='mini')maybeEvent(L);
  c.respawn=e.kind==='boss'?3000:1200; c.en=null;
}
function dropGear(ilvl,rb,L){
  let r=rollRarity(rb);
  if(OFFLINE_RUN&&r>3)r=3;
  let it;
  if(r===5){const pool=UNIQUES.filter(u=>!u.ultra&&u.lay<=L+1);const u=pick(pool);it=makeUnique(u.id,ilvl);bigToast('★ Уникальный: '+u.n);}
  else{const slot=pick(['weapon','weapon','shield','head','body','legs','hands','feet','belt','cloak','ring','amulet']);it=makeItem(slot,null,ilvl,r,'drop');if(r>=4)bigToast('Легендарный: '+it.n);}
  giveItem(it,OFFLINE_RUN); if(OFFLINE_RUN)OFF.items++;
  if(r>=2&&!OFFLINE_RUN)log('Добыча: '+it.n+' ['+RARITY[r].n+']');
}
function dropNote(L){
  const start=(L-1)*5;const free=[];for(let i=start;i<start+5;i++)if(!S.j.notes[i])free.push(i);
  if(!free.length)return;const i=pick(free);S.j.notes[i]=1;questEvent('note',{});
  if(!OFFLINE_RUN){bigToast('Найдена записка ('+Object.keys(S.j.notes).length+'/50)');log('Записка: '+NOTES[i]);}
}
function finishDungeon(){
  const c=S.cb,D=DUNGEONS.find(d=>d.id===c.dg.id);const t=Math.floor(c.dg.t/1000);
  S.st.dungeons++; const rec=S.dRec[D.id];
  if(!rec||t<rec)S.dRec[D.id]=t;
  S.crystals+=5*D.layer+(D.secret?30:0); gainGold(200*D.layer);
  for(let i=0;i<2;i++)dropGear(D.lvl+3,250,D.layer);
  if(rnd()<0.3)dropNote(D.layer);
  log('Данж «'+D.n+'» пройден за '+fmtT(t)+(rec&&t<rec?' — новый рекорд!':''));
  bigToast('Данж пройден: '+fmtT(t));

}

// ===================== СИСТЕМЫ: навыки, крафт, город, квесты, престиж, испытания, оффлайн =====================
let OFF=null;
function log(t){S.log.unshift({t,at:Date.now()});if(S.log.length>60)S.log.length=60;}

// ---------- добыча ----------
function gatherDef(id){for(const k in GATHER){const g=GATHER[k].find(x=>x.id===id);if(g)return g;}return null;}
function psk(sk){return (M.psk&&M.psk[sk])||{};}
function skillSpeed(sk,req){
  let m=1+((M.skillSpeed||0))/100+(psk(sk).sp||0)/100;
  if(GATHER[sk])m+=(M.gatherSpeed||0)/100+toolBonus(sk)/100;
  if(['smith','cook','alch','ench','summon'].includes(sk))m+=(M.craftSpeed||0)/100+(sk==='smith'?(M.craftSpeedSmith||0)/100:0);
  if(req)m+=Math.min(0.3,(lv(sk)-req)*0.01);
  return m;
}
function dualOK(){return !!M.dual||(S.prest.reb+S.prest.asc+S.prest.trans)>0;}
function slotSet(slot,a){if(slot===2)S.act2=a;else{S.act=a;S.cb=null;}}
function startGather(id,slot){const g=gatherDef(id);if(lv(g.skill)<g.lv){toast('Нужен уровень '+g.lv);return;}
  if(slot===2&&!dualOK()){toast('Второй слот откроется после перерождения');return;}
  if((S.res[g.out]||0)>=resCap(g.out)){toast('Склад полон: '+RES[g.out].n);return;}
  slotSet(slot,{type:'gather',id,prog:0});}
function completeGather(g,bonus,a){
  const P=psk(g.skill);let n=1; if(rnd()*100<(M.doubleGather||0)+(P.dbl||0))n=2;
  addRes(g.out,n); gainXp(g.skill,g.xp*(bonus?1.5:1)); S.st.actions++;
  const rare=1+(P.rare||0)/100;
  if(g.skill==='mining'&&rnd()<0.03*rare)addRes('gem'+Math.min(4,Math.floor(g.tier*0.7)),1);
  if(g.skill==='fishing'&&rnd()<0.008*rare){const r=rnd();if(r<0.5){const v=gainGold(20+g.tier*40);if(!OFFLINE_RUN)toast('Сокровище: '+v+' золота');}else if(r<0.85)addRes('gem'+Math.min(4,g.tier>>1),1);else dropNote(Math.min(10,g.tier+1));}
  if(g.skill==='herb'&&rnd()<0.01*rare)addRes('herb'+Math.min(6,g.tier+1),1);
  if(g.skill==='wood'&&rnd()<0.004*rare)dropNote(Math.min(10,g.tier*1+1));
  questEvent('gather',{sk:g.skill,n});
  if(!OFFLINE_RUN)sfx('g_'+g.skill);
  if((S.res[g.out]||0)>=resCap(g.out)){if(!OFFLINE_RUN)toast('Склад полон: '+RES[g.out].n+'. Улучши Склад.');return false;}
  return true;
}
function gatherTick(dt,a){
  const g=gatherDef(a.id); const T=g.t/skillSpeed(g.skill,g.lv);
  a.prog+=dt; while(a.prog>=T){a.prog-=T;if(!completeGather(g,false,a))return false;}
  return true;
}
function activeBoost(slot){
  const a=slot===2?S.act2:S.act;if(!a)return;
  if(a.type==='gather'){if(!completeGather(gatherDef(a.id),true,a))slotSet(slot,null);a.prog=0;sfx('chime');}
  else if(a.type==='craft'){a.prog+=99999;if(!craftTick(0,a))slotEnd(slot);sfx('chime');}
}

// ---------- крафт ----------
function recipeLocked(r){
  if(r.need&&r.need.boss&&!S.bosses[r.need.boss])return 'Победи босса '+r.need.boss+'-го слоя';
  if(r.need&&r.need.secret&&!secretUnlocked(r.need.secret))return 'Тайна не раскрыта';
  if(r.out.tool&&(S.tools[r.out.tool]??-1)>=r.out.tier)return 'Уже есть';
  return '';
}
function startCraft(id,n,slot){const r=REC[id];if(lv(r.skill)<r.lv){toast('Нужен уровень '+r.lv);return false;}
  if(slot===2&&!dualOK()){toast('Второй слот откроется после перерождения');return false;}
  const l=recipeLocked(r);if(l){toast(l);return false;}
  if(!hasRes(r.in,costMult())){toast('Не хватает материалов');return false;}
  slotSet(slot,{type:'craft',id,prog:0,n:n||-1});return true;}
function costMult(){return (M.F&&M.F.dblCost)?2:1;}
function queueMax(){return M.queue10?10:5;}
function queueAdd(id,n){if(S.queue.length>=queueMax()){toast('Очередь заполнена');return;}S.queue.push({id,n:n||10});toast('В очереди: '+REC[id].n+' ×'+(n||10));

  const F=M.F||{}; if(F.noOffline)return null;
  ms=Math.min(ms,offlineCapH()*3600e3); if(ms<60e3)return null;
  const snap={sk:{...S.skills},res:{...S.res},gold:S.gold,kills:S.st.kills,lv:Object.fromEntries(SKILLS.map(s=>[s.id,lv(s.id)]))};
  OFFLINE_RUN=true; OFF={items:0,burned:0,stoppedByDeath:false};
  const wasCombat=S.act&&S.act.type==='combat';
  if(wasCombat&&S.cb){S.cb.active=false;}
  const dt=Math.max(500,Math.floor(ms/120000)); let t=0, k=0;
  try{while(t<ms){gameTick(dt);t+=dt;if(++k%60===0)recalcMods();}}catch(e){console.error(e);}
  OFFLINE_RUN=false; checkAch();
  const rep={ms,gold:S.gold-snap.gold,kills:S.st.kills-snap.kills,items:OFF.items,burned:OFF.burned,died:OFF.stoppedByDeath,res:[],lv:[]};
  for(const id in S.res){const d=(S.res[id]||0)-(snap.res[id]||0);if(d)rep.res.push([id,d]);}
  for(const s of SKILLS){const x=S.skills[s.id]-snap.sk[s.id];if(x>0)rep.lv.push([s.id,x,lv(s.id)-snap.lv[s.id]]);}
  return rep;
}

  S.res[id]--;S.fam={id,until:S.gameMs+famDur(),rev:1,xpAcc:0};recalcMods();if(!OFFLINE_RUN)toast('Призван: '+f.n);sfx('chime');}

function upgCost(it){const t=tierOf(it.ilvl),u=it.up||0;return [['bar'+t,2+u*2],['dust',10+u*15],['gold',100*Math.pow(1.8,u)|0]].concat(u>=5?[['crystals',u*2]]:[]);}
function upgChance(it,tear){return Math.max(10,100-(it.up||0)*9)+(tear?15:0);}
function canPay(list){return list.every(([id,n])=>id==='crystals'?S.crystals>=n:id==='gold'?S.gold>=n:(S.res[id]||0)>=n);}
function pay(list){for(const [id,n] of list){if(id==='crystals')S.crystals-=n;else if(id==='gold')S.gold-=n;else S.res[id]-=n;}}
function upgradeItem(where,i,tear){
  const arr=where==='eq'?S.eq:where==='bank'?S.bank:S.inv;const it=arr[i];if(!it)return;
  if((it.up||0)>=10){toast('Уже +10');return;}const cost=upgCost(it);if(!canPay(cost)){toast('Не хватает материалов');return;}
  if(tear&&!(S.res.tear>0)){toast('Нет Слезы Ока');return;}
  pay(cost);if(tear)S.res.tear--;
  const ch=upgChance(it,tear);
  if(rnd()*100<ch){it.up=(it.up||0)+1;if(it.dmg)it.dmg=+(it.dmg*1.07).toFixed(1);if(it.arm)it.arm=+(it.arm*1.07).toFixed(1);sfx('anvil');bigToast('Успех! '+it.n+' +'+it.up);}
  else{const u=it.up||0;
    if(u>=7&&rnd()<0.25){if(where==='eq'){delete S.eq[i];}else if(where==='bank')S.bank.splice(i,1);else S.inv[i]=null;sfx('death');bigToast('Предмет разрушен…');recalcMods();return 'broken';}
    if(u>=4){it.up=u-1;if(it.dmg)it.dmg=+(it.dmg/1.07).toFixed(1);if(it.arm)it.arm=+(it.arm/1.07).toFixed(1);toast('Провал: уровень заточки упал до +'+it.up);}
    else toast('Провал: материалы потрачены');}
  recalcMods();
}

function mergeItem(i){
  const it=S.inv[i];if(!it||it.u||it.r>=4){toast('Нельзя слить');return;}
  const c=mergeCandidates(it);if(c.length<2){toast('Нужно ещё 2 таких же предмета в сумке');return;}

  if(rnd()<0.75){idx.forEach(j=>S.inv[j]=null);const il=Math.max(...parts.map(p=>p.ilvl));const n=makeItem(it.slot,it.wt,il,it.r+1,'drop');n.n=it.n;S.inv[i]=n;sfx('anvil');bigToast('Слияние удалось: '+RARITY[n.r].n);return n;}

function _rgb(c){if(c.startsWith('rgb')){const m=c.match(/\d+/g);return [+m[0],+m[1],+m[2]];}let h=c.replace('*','').slice(1);if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);return [n>>16,n>>8&255,n&255];}
function _mul([r,g,b],k){return `rgb(${clamp(r*k,0,255)|0},${clamp(g*k,0,255)|0},${clamp(b*k,0,255)|0})`;}
const _sprCache={};
// kind: hero | arch:<..> | boss:<..> | npc:<id>;  pose: {a,k} ; sc — плотность (2 = 64×64 для 32-дизайна)
function getSprite(kind,T,t,pose,sc){
  if(typeof pose!=='object'||pose===null)pose={a:pose?'atk':'idle',k:pose?1:0};
  const key=kind+'|'+T+'|'+pose.a+pose.k+(pose.w||'')+'|'+sc; if(_sprCache[key])return _sprCache[key];
  const [k,v]=kind.split(':');let g;_SCD=sc;

  else if(k==='arch')g=({sword:sprSword,archer:sprArcher,mage:sprMage,beast:sprBeast,undead:sprUndead,mimic:sprMimic}[v])(T,t,pose);
  else if(k==='boss'){_SCD=sc;const f=pose.a==='atk';g=(BOSS_SPR[v]||BOSS_SPR.guard)(T,t,f);
    if(pose.a==='idle'&&pose.k%2){const sh=Math.round(sc*0.5);const d=g.d,w=g.w;for(let y=0;y<g.h-sh;y++)for(let x=0;x<w;x++)d[y*w+x]=d[(y+sh)*w+x];}}
  else if(k==='npc')g=sprNpc(v,pose);
  _SCD=1;
  return _sprCache[key]=_render(g,1,true);
}

function drawEmblem(x,cx,cy,R,t){

  for(let i=1;i<7;i++){const k=Math.pow(i/7,1.8);const y=cy+R*0.7+(by-cy-R*0.7)*k,hw=R*0.08+(bw/2-R*0.08)*k;x.globalAlpha=0.15+0.25*k;x.beginPath();x.moveTo(cx-hw,y);x.lineTo(cx+hw,y);x.stroke();}

    x.beginPath();x.moveTo(Math.cos(a)*R*1.05,Math.sin(a)*R*1.05);x.lineTo(Math.cos(a+0.04)*l*0.92,Math.sin(a+0.04)*l*0.92);x.lineTo(Math.cos(a)*l,Math.sin(a)*l);x.stroke();}

  x.fillStyle='#120808';x.beginPath();x.moveTo(cx-R,cy+R);for(let i=0;i<=40;i++){const px=cx-R+i*R/20;x.lineTo(px,cy+R*0.42-Math.sin(i*0.7)*R*0.04-Math.sin(i*0.23)*R*0.06);}x.lineTo(cx+R,cy+R);x.fill();
  // дорога к солнцу
  x.fillStyle='rgba(232,197,71,0.28)';x.beginPath();x.moveTo(cx-R*0.03,cy+R*0.4);x.lineTo(cx+R*0.03,cy+R*0.4);x.lineTo(cx+R*0.42,cy+R);x.lineTo(cx-R*0.42,cy+R);x.fill();
  // Странник — силуэт

    const hx=cx-32*k,hy=cy+R*0.98-64*k;x.drawImage(sil,hx,hy,64*k,64*k);
    x.fillStyle='#ffd04a';x.fillRect(hx+31*k,hy+17*k,2.4*k,2*k);x.fillRect(hx+37*k,hy+17*k,2.4*k,2*k);}catch(e){}
  // пепел
  for(let i=0;i<26;i++){const a=i*2.4,r=R*(0.2+((i*37)%70)/100);const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r-((t*20+i*13)%(R*0.3));x.fillStyle=i%4?'rgba(220,200,180,0.5)':'rgba(255,170,70,0.8)';x.fillRect(px,py,Math.max(1,R*0.012),Math.max(1,R*0.012));}
  x.restore();
  // кант
  x.strokeStyle='#c9a227';x.lineWidth=Math.max(2,R*0.045);x.beginPath();x.arc(cx,cy,R*0.965,0,7);x.stroke();
  x.strokeStyle='rgba(232,197,71,0.35)';x.lineWidth=Math.max(1,R*0.015);x.beginPath();x.arc(cx,cy,R*0.9,0,7);x.stroke();
}

function _toast(t,cls,ms){if(OFFLINE_RUN)return;const box=$('#toasts');if([...box.children].some(c=>c.textContent===t&&!c.classList.contains('out')))return;
  const d=document.createElement('div');d.className='toast '+cls;d.textContent=t;box.prepend(d);setTimeout(()=>d.classList.add('out'),ms);setTimeout(()=>d.remove(),ms+500);
  while(box.children.length>3)box.lastChild.remove();dirty=true;}

let resIc=id=>{const r=RES[id];return r?iconUrl(r.ic,tierTint(id)||POT_COL[id]||null):iconUrl('rune');};
function resChip(id,n,have){const r=RES[id];const ok=have===undefined||have>=n;
  if(id==='gold')return `<span class="chip ${ok?'':'bad'}">${icon('gold')}${fmt(n)}</span>`;
  return `<span class="chip ${ok?'ok':'bad'}" title="${esc(r.n)}"><img class="ic" src="${resIc(id)}">${fmt(n)} <small>${esc(r.n)}${have!==undefined?' · есть '+fmt(have):''}</small></span>`;}
function costList(list,mult){mult=mult||1;return list.map(([id,n])=>resChip(id,n*mult,id==='gold'?S.gold:(S.res[id]||0))).join('');}
function bar(pct,cls,live){return `<div class="bar ${cls||''}"><i ${live?`data-live="${live}"`:''} style="width:${clamp(pct,0,100)}%"></i></div>`;}
function xpPct(id){const x=S.skills[id],l=lv(id);if(l>=99)return 100;return (x-XP_TABLE[l])/(XP_TABLE[l+1]-XP_TABLE[l])*100;}
function itemCell(it,where,i){if(!it)return `<div class="cell empty"></div>`;
  return `<div class="cell r${it.r}" data-a="item" data-w="${where}" data-i="${i}"><img src="${itemIconUrl(it)}"><b>${it.ilvl}</b></div>`;}
function actName(){const a=S.act;if(!a)return 'Отдых у костра';
  if(a.type==='gather')return gatherDef(a.id).n; if(a.type==='craft')return REC[a.id].n+(a.n>0?' ×'+a.n:'');
  if(a.type==='combat')return S.cb&&S.cb.en?'Бой: '+S.cb.en.name:'Бой'; if(a.type==='pray')return 'Молитва над прахом'; if(a.type==='thieve')return 'Карманные кражи';return '';}
function actProg(){const a=S.act;if(!a)return 0;
  if(a.type==='gather'){const g=gatherDef(a.id);return a.prog/(g.t/skillSpeed(g.skill,g.lv))*100;}
  if(a.type==='craft'){const r=REC[a.id];return a.prog/(r.t/skillSpeed(r.skill,r.lv))*100;}
  if(a.type==='pray')return a.prog/(2400/skillSpeed('prayer'))*100; if(a.type==='thieve')return a.prog/(3000/skillSpeed('attack'))*100;
  if(a.type==='combat'&&S.cb&&S.cb.en)return 100-S.cb.en.hp/S.cb.en.maxhp*100; return 0;}

 <div class="card"><b>Сохранение</b><div class="sub">Автосейв каждые 10 секунд и при закрытии. Сейв хранится только в этом браузере — делай резервную копию.</div><button data-a="saveNow">Сохранить сейчас</button><button data-a="export">Экспорт</button><textarea id="ioTxt" placeholder="Вставь сюда код сейва для импорта"></textarea><button data-a="import">Импорт</button></div>
 <div class="card"><b>Облако Telegram</b><div class="sub">${tgCloud()?'Сейв копируется в облако Telegram каждые 5 минут.'+(S.cloudAt?' Последняя копия: '+new Date(S.cloudAt).toLocaleString():''):'Доступно, когда игра открыта как Telegram Mini App.'}</div>${tgCloud()?'<button data-a="cloudSave">Сохранить в облако</button><button data-a="cloudLoad">Загрузить из облака</button>':''}</div>
 <div class="card"><b>Опасная зона</b><button class="danger" data-a="reset">Стереть прогресс</button></div>
 <div class="sub">Пепельный Путь · версия сейва ${VERSION} · горячие клавиши: 1–5 способности, пробел — уклон, E — еда, Q — зелье</div>`;

// ---------- окно предмета ----------
function itemDesc(it,cmp){
  const R=RARITY[it.r];let h=`<div class="ititle" style="color:${R.c}">${esc(it.n)}</div><div class="sub">${R.n} · ${SLOT_N[it.slot]||it.slot} · ур. предмета ${it.ilvl}${it.q?' · качество +'+it.q+'%':''}</div>`;
  if(it.dmg)h+=`<div>Урон: <b>${it.dmg}</b> · скорость ${(WEAP[it.wt].spd/1000).toFixed(1)}с · ${SK[WEAP[it.wt].sk].n}${cmp&&cmp.dmg?diff(it.dmg-cmp.dmg):''}</div>`;
  if(it.arm)h+=`<div>Броня: <b>${it.arm}</b>${cmp&&cmp.arm!==undefined?diff(it.arm-(cmp.arm||0)):''}</div>`;
  for(const a of it.aff)h+=`<div class="aff">${affText(a)}</div>`;
  if(it.leg)h+=`<div class="aff leg">★ ${it.leg.d}</div>`;
  if(it.u){const u=UNQ[it.u];h+=`<div class="aff uniq">${esc(u.d)}</div>`;if(u.ability)h+=`<div class="aff uniq">Способность: ${ABL[u.ability].n} — ${ABL[u.ability].d}</div>`;}
  if(it.rsk)h+=`<div class="sub ${canEquip(it)?'':'bad'}">Требуется: ${SK[it.rsk].n} ${it.req}</div>`;
  h+=`<div class="sub">Цена: ${itemValue(it)} зол.</div>`;return h;}
function diff(v){v=+v.toFixed(1);return v?` <span class="${v>0?'up':'bad'}">${v>0?'▲':'▼'}${Math.abs(v)}</span>`:'';}
function openItem(where,i){
  const it=where==='eq'?S.eq[i]:where==='bank'?S.bank[i]:S.inv[i];if(!it)return;
  const cmp=where!=='eq'?S.eq[slotFor(it)]:null;
  let h=itemDesc(it,cmp);
  if(cmp)h+=`<details><summary>Сейчас надето</summary>${itemDesc(cmp)}</details>`;
  h+='<div class="btns">';
  if(where==='inv')h+=`<button data-a="equip" data-i="${i}" ${canEquip(it)?'':'class="dim"'}>Надеть</button><button data-a="toBank" data-i="${i}">В банк</button><button data-a="sellIt" data-w="inv" data-i="${i}">Продать</button>`;
  if(where==='eq')h+=`<button data-a="unequip" data-s="${i}">Снять</button>`;
  if(where==='bank')h+=`<button data-a="fromBank" data-i="${i}">В сумку</button><button data-a="sellIt" data-w="bank" data-i="${i}">Продать</button>`;
  if(where!=='bank'){const uc=upgCost(it);h+=`</div><div class="card"><b>Заточка ${it.up?'+'+it.up:''}</b> <small>шанс ${upgChance(it)}% (+15% со Слезой Ока)${(it.up||0)>=4?' · провал: −1 уровень':''}${(it.up||0)>=7?' · 25% разрушить':''}</small><div class="costs">${uc.map(([k,n])=>k==='crystals'?`<span class="chip ${S.crystals>=n?'':'bad'}">${icon('crystal')}${n}</span>`:resChip(k,n,k==='gold'?S.gold:(S.res[k]||0))).join('')}</div>${(it.up||0)<10?`<button class="sm" data-a="upg" data-w="${where}" data-i="${i}">Заточить</button><button class="sm" data-a="upgT" data-w="${where}" data-i="${i}">Со Слезой</button>`:'<span class="gold">Максимум</span>'}</div><div class="btns">`;}
  if(where==='inv'&&!it.u&&it.r<4){const mc=mergeCandidates(it).length;h+=`<button class="sm ${mc>=2?'':'dim'}" data-a="merge" data-i="${i}">Слить 3→1 (${mc+1}/3, 75%)</button>`;}
  if(where!=='eq')h+=`<button class="sm" data-a="dis" data-w="${where}" data-i="${i}">Разобрать</button>`;
  if(!it.u)h+=`<button data-a="reforge" data-w="${where}" data-i="${i}">Перековать (${5+Math.floor(it.ilvl/5)} крист.)</button>`;
  const runes=RUNES.filter(r=>S.res[r.id]>0);for(const r of runes)h+=`<button class="sm" data-a="rune" data-r="${r.id}" data-w="${where}" data-i="${i}">${r.n} (${S.res[r.id]})</button>`;
  h+='</div>';modal(h);
}
function getItem(w,i){return w==='eq'?S.eq[i]:w==='bank'?S.bank[i]:S.inv[i];}

// ---------- действия ----------
const ACT={
  closeModal,
  tab:d=>{TAB[d.k]=isNaN(+d.v)?d.v:+d.v;},
  sub:d=>{SUB=d.v||null;},
  go:d=>{nav(d.v,d.s);return 'no';},
  skill:d=>{nav('skills',d.id);return 'no';},
  build:d=>upgradeBuilding(d.id),
  claim:d=>claimQuest(d.id),
  npc:d=>{const n=d.id;if(n==='merchant')SUB='shop';else if(['smith','alch','herb','fisher'].includes(n)){nav('skills',{smith:'smith',alch:'alch',herb:'herb',fisher:'fishing'}[n]);return 'no';}
    else if(n==='guard'){nav('combat');return 'no';}else if(n==='priest')startPray();else if(n==='thief')startThieve();else if(n==='bard'){nav('more','journal');return 'no';}},
  buy:d=>buy(d.id,+d.p,+d.n), caravan:d=>buyCaravan(+d.i),
  sellRes:d=>sellRes(d.id,d.n==='all'?S.res[d.id]:+d.n),
  gather:d=>startGather(d.id), craft:d=>startCraft(d.id,+d.n), pray:()=>startPray(),
  stop:()=>{S.act=null;S.cb=null;},
  mg:()=>{const now=performance.now();if(now-(ACT._mg||0)<500)return 'no';ACT._mg=now;const p=mgPos();if(p>0.4&&p<0.6){activeBoost();}else{if(S.act)S.act.prog=0;toast('Мимо!');}},
  style:d=>{S.style=d.v;},
  fight:d=>{if(S.cb&&S.cb.dg&&S.act){toast('Сначала закончи данж');return;}const ok=startCombat(d.k,+d.l,+d.i);if(ok){nav('combat');window.scrollTo(0,0);$('#main').scrollTop=0;}return 'no';},
  dungeon:d=>{if(startCombat('dungeon',DUNGEONS.find(x=>x.id===d.id).layer,d.id)){SUB=null;$('#main').scrollTop=0;}},
  useAbil:d=>{if(d.id)useAbility(d.id);return 'no';}, dodge:()=>{dodge();return 'no';},
  eat:()=>{if(S.cb)eatFood(true);return 'no';}, potion:()=>{drinkPotion();return 'no';},
  toggleActive:()=>{if(S.cb)S.cb.active=!S.cb.active;},
  toggleAuto:()=>{S.set.autoAbil=S.set.autoAbil?0:1;toast(S.set.autoAbil?'Герой сам применяет способности':'Способности — только вручную');},
  abilCfg:()=>{abilCfg();return 'no';}, foodCfg:()=>{TAB.inv=1;nav('inv');return 'no';},
  setAbil:d=>{const i=+d.i;const id=d.id||null;const j=S.abil.indexOf(id);if(id&&j>=0)S.abil[j]=S.abil[i];S.abil[i]=id;abilCfg();return 'no';},
  item:d=>{openItem(d.w,d.w==='eq'?d.i:+d.i);return 'no';},
  equip:d=>{const it=S.inv[+d.i];if(!canEquip(it)){toast('Не хватает уровня');return;}const sl=slotFor(it);const old=S.eq[sl];S.eq[sl]=it;S.inv[+d.i]=old||null;recalcMods();closeModal();sfx('chime');},
  unequip:d=>{const i=invFree();if(i<0){toast('Сумка полна');return;}S.inv[i]=S.eq[d.s];delete S.eq[d.s];recalcMods();closeModal();},
  toBank:d=>{if(S.bank.length>=500){toast('Банк полон');return;}S.bank.push(S.inv[+d.i]);S.inv[+d.i]=null;closeModal();},
  fromBank:d=>{const i=invFree();if(i<0){toast('Сумка полна');return;}S.inv[i]=S.bank.splice(+d.i,1)[0];closeModal();},
  sellIt:d=>{const g=sellItem(d.w,+d.i);toast('+'+g+' золота');closeModal();},
  reforge:d=>{const it=getItem(d.w,d.w==='eq'?d.i:+d.i);reforge(it);openItem(d.w,d.w==='eq'?d.i:+d.i);return 'no';},
  rune:d=>{const it=getItem(d.w,d.w==='eq'?d.i:+d.i);applyRune(d.r,it);openItem(d.w,d.w==='eq'?d.i:+d.i);return 'no';},
  runeUse:d=>{TAB.inv=0;toast('Открой предмет и выбери руну');},
  sortInv, sellGray:()=>toast('+'+sellAllGray()+' золота'),
  allToBank:()=>{S.inv.forEach((it,i)=>{if(it&&!it.u&&S.bank.length<500){S.bank.push(it);S.inv[i]=null;}});},
  bank:()=>{TAB.inv=2;nav('inv');return 'no';},
  setFood:d=>{S.food=d.id;}, setPot:d=>{S.potion=d.id;}, drink:d=>{drinkPotion(d.id);},
  prest:d=>{if(S.challenge){toast('Во время испытания престиж недоступен');return;}const f={reb:doRebirth,asc:doAscend,trans:doTrans}[d.v];const ok={reb:canRebirth,asc:canAscend,trans:canTrans}[d.v]();if(!ok){toast('Условие не выполнено');return;}
    modal(`<h3>Уверен?</h3><div class="sub">Это действие нельзя отменить.</div><button class="danger" data-a="prestGo" data-v="${d.v}">Да</button>`);return 'no';},
  prestGo:d=>{({reb:doRebirth,asc:doAscend,trans:doTrans})[d.v]();closeModal();saveGame();bigToast('Пепел к пеплу. Путь начинается снова.');},
  echo:d=>buyEcho(d.id),
  startCh:d=>{modal(`<h3>Начать испытание?</h3><div class="sub">Текущий прогресс уйдёт в резерв и вернётся после испытания.</div><button data-a="startChGo" data-id="${d.id}">Начать</button>`);return 'no';},
  startChGo:d=>{startChallenge(d.id);closeModal();saveGame();nav('town');return 'no';},
  abandonCh:()=>{modal(`<h3>Сдаться?</h3><button class="danger" data-a="abandonGo">Да, вернуться к основному сейву</button>`);return 'no';},
  abandonGo:()=>{endChallenge(false);closeModal();saveGame();nav('town');return 'no';},
  title:d=>{},
  saveNow:()=>{saveGame();toast('Сохранено');},
  export:()=>{const t=exportSave();$('#ioTxt').value=t;try{navigator.clipboard.writeText(t).then(()=>toast('Скопировано в буфер'),()=>toast('Код в поле ниже — скопируй его'));}catch(e){toast('Код в поле ниже');}return 'no';},
  import:()=>{try{const s=importSave($('#ioTxt').value);S=s;recalcMods();saveGame();toast('Сейв загружен');nav('town');}catch(e){toast('Ошибка: '+e.message);}return 'no';},
  reset:()=>{modal(`<h3>Стереть всё?</h3><div class="sub">Весь прогресс будет удалён без возврата.</div><button class="danger" data-a="resetGo">Стереть</button>`);return 'no';},
  resetGo:()=>{localStorage.removeItem(LS_KEY);localStorage.removeItem(BK_KEY);S=newState();starterKit();recalcMods();closeModal();intro();nav('town');return 'no';},
  ending:d=>{chooseEnding(d.v);closeModal();saveGame();nav('town');bigToast(d.v==='light'?'Солнце зажжено':'Ты — новое солнце');return 'no';},
  thieve:()=>startThieve(),
};
function abilCfg(){
  const avail=ABILITIES.filter(canUseAbil);
  let h='<h3>Способности</h3><div class="sub">Нажми слот, затем способность.</div>';
  const sel=ACT._slot||0;
  h+=`<div class="abil">${Array.from({length:abilSlots()},(_,i)=>`<button class="ab ${i===sel?'on':''}" data-a="slotSel" data-i="${i}"><b>${i+1}</b>${S.abil[i]&&ABL[S.abil[i]].ic?`<img class="abi" src="${iconUrl(ABL[S.abil[i]].ic)}">`:''}${S.abil[i]?ABL[S.abil[i]].n:'пусто'}</button>`).join('')}</div><div class="list">`;
  h+=`<div class="li"><span class="grow">— убрать —</span><button class="sm" data-a="setAbil" data-i="${sel}" data-id="">Пусто</button></div>`;
  for(const a of avail)h+=`<div class="li">${a.ic?`<img class="ic famic" src="${iconUrl(a.ic)}">`:''}<span class="grow"><b>${a.n}</b> <small>${SK[a.sk].n}${a.uniq?' · уникальная':''}</small><br><small>${a.d} · ${a.v} ${({adr:'адр.',mana:'маны',faith:'веры'})[a.c]} · КД ${a.cd}с</small></span><button class="sm" data-a="setAbil" data-i="${sel}" data-id="${a.id}">В слот ${sel+1}</button></div>`;
  modal(h+'</div>');
}
ACT.slotSel=d=>{ACT._slot=+d.i;abilCfg();return 'no';};

document.addEventListener('click',e=>{
  audioInit();
  const el=e.target.closest('[data-a]');if(!el)return;
  if(el.closest('#modal.closing'))return;
  if(el.tagName==='SELECT')return;
  if(el.id==='modal'&&e.target!==el)return;
  const f=ACT[el.dataset.a];if(!f)return;
  const r=f(el.dataset);if(r!=='no'&&!modalOn)render();
});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.a==='filt'){TAB[el.dataset.k]=+el.value;render();}
  if(el.dataset.a==='title'){S.title=el.value;}});
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset.in)return;const k=el.dataset.in;
  if(k==='notif'){S.set.notif=el.value/100;$('#vn').textContent=el.value+'%';applyNotif();}
  else{S.set[k]=+el.value;$(k==='music'?'#vm':'#vs').textContent=el.value+'%';audioInit();applyVolume();}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
document.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;audioInit();
  if(e.code==='Space'){e.preventDefault();dodge();}
  else if(/^Digit[1-5]$/.test(e.code)){const i=+e.code[5]-1;if(S.abil[i])useAbility(S.abil[i]);}
  else if(e.code==='KeyE'){if(S.cb)eatFood(true);} else if(e.code==='KeyQ')drinkPotion();
  else if(e.code==='Escape')closeModal();});
['touchstart','wheel','scroll'].forEach(ev=>document.addEventListener(ev,()=>{lastTouch=Date.now();},{passive:true,capture:true}));
function applyNotif(){document.documentElement.style.setProperty('--notif',S.set.notif);}

// ---------- навигация и рендер ----------
function nav(scr,sub){SCR=scr;SUB=sub||null;render(true);document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.n===scr));}
document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>{audioInit();nav(b.dataset.n);}));
function render(reset){
  const m=$('#main');const st=m.scrollTop;
  try{m.innerHTML=SCREENS[SCR]();}catch(e){m.innerHTML='<div class="card bad">Ошибка экрана: '+esc(e.message)+'</div>';console.error(e);}
  m.scrollTop=reset?0:st; dirty=false; renderKey=combatKey(); liveUpdate();
  if(typeof tutHL==='function')tutHL();
  paintLogos(m);
  document.querySelectorAll('canvas.npcAv').forEach(c=>{const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(getSprite('npc:'+c.dataset.npc,'','',{a:'idle',k:0},2),0,0);});
}
function combatKey(){const c=S.cb;return SCR+'|'+(S.act?S.act.type+(S.act.id||''):'')+'|'+(c?c.kind+c.layer+c.idx+(c.en?c.en.name:''):'')+'|'+SUB;}

// ---------- живые значения ----------
const LIVE={
  xp:(el,id)=>{el.style.width=xpPct(id)+'%';},
  xptxt:(el,id)=>{const l=lv(id);el.textContent=l>=99?'Максимум':`${fmt(S.skills[id])} / ${fmt(XP_TABLE[l+1])} опыта · ещё ${fmt(XP_TABLE[l+1]-S.skills[id])} до ${l+1}-го уровня`;},
  eta:(el,id)=>{const a=S.act;if(!a||lv(id)>=99){el.textContent='';return;}let xp,T;if(a.type==='gather'){const g=gatherDef(a.id);if(g.skill!==id)return;xp=g.xp;T=g.t/skillSpeed(g.skill,g.lv);}else if(a.type==='craft'){const r=REC[a.id];if(r.skill!==id)return;xp=r.xp;T=r.t/skillSpeed(r.skill,r.lv);}else return;const rate=xp/(T/1000);const need=XP_TABLE[lv(id)+1]-S.skills[id];el.textContent='· до ур. '+(lv(id)+1)+' ≈ '+fmtT(need/rate)+' · '+fmt(rate*3600)+' опыта/ч';},
  actbar:el=>{el.style.width=clamp(actProg(),0,100)+'%';},
  php:el=>{const c=S.cb;if(!c||!c.st)return;el.style.width=c.php/c.st.hp*100+'%';el.parentNode.classList.toggle('shield',c.shield>0);},
  phpt:el=>{const c=S.cb;if(!c||!c.st)return;el.textContent=`${Math.max(0,Math.floor(c.php))}/${c.st.hp}${c.shield>0?' +'+Math.floor(c.shield):''}`;},
  pmana:el=>{const c=S.cb;if(c&&c.st)el.style.width=c.mana/c.st.mana*100+'%';},
  padr:el=>{const c=S.cb;if(c)el.style.width=c.adr+'%';},
  pfaith:el=>{const c=S.cb;if(c)el.style.width=c.faith+'%';},
  ab:(el,i)=>{const id=S.abil[i];const c=S.cb;if(!id||!c)return;const a=ABL[id];const cd=c.cds[id]||0;const ok=canUseAbil(a)&&c[a.c]>=a.v&&!cd;
    el.classList.toggle('ready',ok);const ce=el.querySelector('.cd');if(ce)ce.style.height=(cd/a.cd*100)+'%';else dirty=true;},
  dodgeBtn:el=>{const c=S.cb;el.classList.toggle('alert',!!(c&&c.en&&[c.en,...c.adds].some(e=>e.tele>0&&!e.dodged)));},
  foodBtn:el=>{el.dataset.n=S.food?fmt(S.res[S.food]||0):'';},
  potBtn:el=>{el.dataset.n=S.potion?fmt(S.res[S.potion]||0):'';},
  dgwave:el=>{const c=S.cb;if(c&&c.dg)el.textContent=Math.min(c.dg.wave+1,5)+'/5';},
  dgtime:el=>{const c=S.cb;if(c&&c.dg)el.textContent=fmtT(c.dg.t/1000)+' / 15м';},
};
function liveUpdate(){
  $('#tGold').textContent=fmt(S.gold);$('#tCr').textContent=fmt(S.crystals);$('#tEcho').textContent=fmt(S.echo);$('#tTear').textContent=fmt(S.res.tear||0);
  $('#tAct').textContent=actName()+(S.act2?' + '+(S.act2.type==='gather'?gatherDef(S.act2.id).n:REC[S.act2.id].n):'');$('#tActBar').style.width=clamp(actProg(),0,100)+'%';
  document.querySelectorAll('[data-live]').forEach(el=>{const [k,a]=el.dataset.live.split(':');if(LIVE[k])try{LIVE[k](el,a);}catch(e){reportError(e);}});
  const mk=$('#mgmark');if(mk)mk.style.left=(mgPos()*100)+'%';
}
function mgPos(){return (Math.sin(performance.now()/550)+1)/2;}

// ---------- сцены ----------
const ASH=[];for(let i=0;i<40;i++)ASH.push({x:Math.random(),y:Math.random(),s:0.3+Math.random()*0.7});
function drawSky(x,W,H,c1,c2,t){
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a0a0c');g.addColorStop(0.6,c1);g.addColorStop(1,c2);x.fillStyle=g;x.fillRect(0,0,W,H);
  const ex=W*0.8,ey=H*0.22,r=Math.min(26,H*0.13),p=1+Math.sin(t/1800)*0.06;
  const rg=x.createRadialGradient(ex,ey,2,ex,ey,r*3*p);rg.addColorStop(0,'rgba(212,68,68,0.9)');rg.addColorStop(0.3,'rgba(139,26,26,0.5)');rg.addColorStop(1,'rgba(139,26,26,0)');

}

  TOWNNPC.forEach(p=>{p.x+=p.v*dt;if(p.x<0.03||p.x>0.95)p.v*=-1;if(Math.random()<0.002)p.v=(Math.random()-0.5)*0.00005;

    if(!open){x.fillStyle='rgba(0,0,0,0.6)';x.fillRect(0,y,W,bh);}

    const here=S.cb&&S.act&&S.act.type==='combat'&&S.cb.layer===L&&S.cb.kind!=='endless';

      const hs=getSprite('hero','','',{a:'walk',k:Math.floor(t/150)%4,w:heroLook()},1);x.drawImage(hs,W-60,y+bh-hs.height+2);}
    if(L===S.unlockedLayer&&!S.bosses[L]){x.fillStyle=`rgba(212,68,68,${0.5+0.4*Math.sin(t/300)})`;x.beginPath();x.arc(W-30,y+bh/2+4,4,0,7);x.fill();}
  }

  x.strokeStyle='rgba(232,197,71,0.35)';x.setLineDash([3,4]);x.beginPath();for(let L=1;L<=Math.min(10,S.unlockedLayer);L++){const px=W*0.55+Math.sin(L*1.7)*W*0.15,py=(L-0.5)*bh;L===1?x.moveTo(px,py):x.lineTo(px,py);}x.stroke();x.setLineDash([]);

const WX=[];
function weather(x,W,H,L,t,dt){
  if(S.set.eco)return;
  const cfg={1:{c:'200,190,180',n:60,vx:-0.12,vy:0.06,s:2},2:{c:'255,140,60',n:30,vx:0.01,vy:-0.04,s:2,glow:1},3:{c:'170,190,210',n:70,vx:-0.02,vy:0.22,s:1,len:5},4:{c:'210,200,170',n:25,vx:0.01,vy:0.01,s:1},
    5:{c:'255,110,40',n:40,vx:0.02,vy:-0.07,s:2,glow:1},6:{c:'235,245,255',n:80,vx:-0.18,vy:0.08,s:2},7:{c:'200,110,160',n:25,vx:-0.05,vy:0.04,s:3,sway:1},8:{c:'190,170,255',n:30,vx:0,vy:-0.02,s:2,glow:1},
    9:{c:'170,60,100',n:35,vx:0.01,vy:-0.02,s:3,sway:1},10:{c:'232,197,71',n:40,vx:0,vy:-0.03,s:2,glow:1}}[L]||{c:'200,200,200',n:30,vx:0,vy:0.05,s:1};
  const gust=1+0.6*Math.sin(t/2500);
  while(WX.length<cfg.n)WX.push({x:Math.random(),y:Math.random(),z:0.4+Math.random()*0.6,p:Math.random()*6});
  WX.length=cfg.n;
  for(const w of WX){w.x+=cfg.vx*w.z*gust*dt/1000;w.y+=cfg.vy*w.z*dt/1000;if(cfg.sway)w.x+=Math.sin(t/600+w.p)*0.0003;
    if(w.x<0)w.x+=1;if(w.x>1)w.x-=1;if(w.y>1)w.y-=1;if(w.y<0)w.y+=1;
    const a=cfg.glow?0.4+0.4*Math.sin(t/300+w.p):0.5*w.z;x.fillStyle=`rgba(${cfg.c},${a})`;
    if(cfg.len){x.fillRect(w.x*W,w.y*H,1,cfg.len*w.z);}else x.fillRect(w.x*W,w.y*H,cfg.s*w.z,cfg.s*w.z);}
  if(L===8&&Math.random()<dt/9000){V.flash={c:'rgba(200,180,255,',t0:performance.now(),dur:180};}
  if(L===5){x.fillStyle=`rgba(255,80,20,${0.04+0.03*Math.sin(t/400)})`;x.fillRect(0,H*0.6,W,H*0.4);}
}

// ---------- движок ----------
function tutState(){if(!S.tut||typeof S.tut!=='object')S.tut={cur:null,step:0,done:{},off:false,min:false,cx:{}};const T=S.tut;if(!T.done||typeof T.done!=='object')T.done={};if(!T.cx||typeof T.cx!=='object')T.cx={};if(T.cur&&!TUT[T.cur])T.cur=null;return T;}
function tutStart(id){const T=tutState();T.cur=id;T.step=0;T.min=false;(TUT[id].cx||[]).forEach(c=>T.cx[c]=1);tutRender();}
function tutFinish(){const T=tutState();if(T.cur)T.done[T.cur]=1;T.cur=null;T.step=0;tutRender();}
function tutNext(){const T=tutState();if(!T.cur)return;T.step++;if(T.step>=TUT[T.cur].steps.length){tutFinish();sfx('lvl');}else{sfx('chime');tutRender();}}
function tutTick(){
  const T=tutState();if(T.off||modalOn&&!T.cur)return;
  if(!T.cur){
    const nm=TUT_MAIN.find(id=>!T.done[id]);
    if(nm&&!T.paused)tutStart(nm);
    else{const c=TUT_CTX.find(id=>!T.done[id]&&TUT[id].ctx());if(c)tutStart(c);}
    return;}
  const st=TUT[T.cur].steps[T.step];
  if(st&&st.until){try{if(st.until())tutNext();}catch(e){}}
}
function tutHL(){const tp=document.getElementById('tut');document.documentElement.style.setProperty('--tuth',(tp&&tp.classList.contains('on')?tp.offsetHeight:0)+'px');document.querySelectorAll('.tut-hl').forEach(e=>e.classList.remove('tut-hl'));
  const T=S&&S.tut;if(!T||T.off||!T.cur||T.min)return;const st=TUT[T.cur].steps[T.step];if(!st||!st.hl)return;
  for(const sel of st.hl.split(',')){const el=document.querySelector(sel);if(el){el.classList.add('tut-hl');if(T._sc!==T.cur+T.step){T._sc=T.cur+T.step;el.scrollIntoView({block:'center',behavior:'smooth'});}break;}}}
function tutRender(){
  let p=document.getElementById('tut');if(!p){p=document.createElement('div');p.id='tut';document.getElementById('app').appendChild(p);}
  const T=tutState();if(T.off||!T.cur){p.className='';p.innerHTML='';return;}
  const ch=TUT[T.cur],st=ch.steps[T.step];const main=TUT_MAIN.indexOf(T.cur);
  const head=`${main>=0?'Глава '+(main+1)+'/'+TUT_MAIN.length+' · ':'Новое: '}${ch.n} · ${T.step+1}/${ch.steps.length}`;
  if(T.min){p.className='on min';p.innerHTML=`<div class="tuth" data-a="tutMax"><canvas class="tutav" width="64" height="64"></canvas><b>${head}</b><span>▲</span></div>`;}
  else p.className='on',p.innerHTML=`<div class="tuth"><canvas class="tutav" width="64" height="64"></canvas><b>${head}</b><span data-a="tutMin">▼</span></div>
    <div class="tutx">${esc(st.x)}</div>
    <div class="tutb">${st.until?`<span class="sub">${'⏳ выполни действие'}</span><button class="sm" data-a="tutNext">Пропустить шаг</button>`:`<button class="sm gold" data-a="tutNext">${T.step+1>=ch.steps.length?'Понятно':'Далее'}</button>`}
    <button class="sm" data-a="tutSkip">Пропустить главу</button><button class="sm" data-a="tutOff">Выключить</button></div>`;
  const av=p.querySelector('.tutav');if(av){const x=av.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(getSprite('npc:priest','','',{a:'idle',k:0},2),0,0);}
  tutHL();
}
Object.assign(ACT,{

  tutOff:()=>{modal(`<h3>Выключить обучение?</h3><div class="sub">Включить снова и пройти любую главу можно в «Меню → Справочник».</div><button data-a="tutOffGo">Выключить</button><button data-a="closeModal">Оставить</button>`);return 'no';},
  tutOffGo:()=>{tutState().off=true;closeModal();tutRender();},
  tutMin:()=>{tutState().min=true;tutRender();return 'no';},

  tutAll:()=>{const T=tutState();T.paused=false;T.off=false;closeModal();tutRender();},
  tutOn:()=>{const T=tutState();T.off=false;T.paused=false;tutRender();},
  tutReplay:d=>{const T=tutState();T.off=false;delete T.done[d.id];tutStart(d.id);nav('town');return 'no';},
  tutReset:()=>{S.tut={cur:null,step:0,done:{},off:false,min:false,cx:{}};nav('town');return 'no';},

  let h=`<h2>Справочник</h2><div class="sub">Всё о каждой механике. Новое отмечено ●. Обучение: ${T.off?'<b class="bad">выключено</b> <button class="sm" data-a="tutOn">Включить</button>':'<b class="gold">включено</b>'} <button class="sm" data-a="tutReset">Начать заново</button></div>`;
  h+='<h3>Главы обучения</h3><div class="list">'+[...TUT_MAIN,...TUT_CTX].map(id=>`<div class="li"><span class="grow">${T.done[id]?'✓ ':''}${TUT[id].n}</span><button class="sm" data-a="tutReplay" data-id="${id}">${T.done[id]?'Повторить':'Пройти'}</button></div>`).join('')+'</div>';
  h+='<h3>Статьи</h3><div class="list">'+Object.entries(CODEX).map(([id,c])=>`<div class="li" data-a="codex" data-id="${id}"><span class="grow">${T.cx[id]?'':'● '}${c[0]}</span><small>›</small></div>`).join('')+'</div>';
  return h;};

// ================= 1.0.3: сравнение экипировки, превью заточки, замок, разбор с отчётом =================
const UPG_K=1.07;
function upTxt(it){return it&&it.up?' +'+it.up:'';}

// ---------- что будет с героем, если надеть/снять ----------
function heroSnap(){const p=playerStats();return {p,m:M,dps:p.dmg*(1+p.crit/100*(p.critMult-1))/(p.speed/1000)};}
function simSlot(sl,it){const old=S.eq[sl];if(it)S.eq[sl]=it;else delete S.eq[sl];recalcMods();const r=heroSnap();if(old)S.eq[sl]=old;else delete S.eq[sl];recalcMods();return r;}
const MOD_N={xpPct:'Опыт',dropPct:'Шанс добычи',goldPct:'Золото',lifesteal:'Вампиризм',thorns:'Шипы',burnOnHit:'Шанс поджога',bleedOnHit:'Шанс кровотечения',poisonOnHit:'Шанс отравления',flatDmg:'Плоский урон',dmgPct:'Урон',armorPct:'Броня',speedPct:'Скорость атаки',critMult:'Сила крита',magicPct:'Урон магии',potPct:'Сила зелий',gatherSpeed:'Скорость сбора',craftSpeed:'Скорость ремесла',combatXp:'Боевой опыт',eliteLoot:'Добыча с элит'};
const SHOWN_K=new Set(['hp','mana','regen','critPct','resFire','resIce','resShock','resPoison','resDark','resAll','skill','F','psk','uAbil','xpSk','dmgPct','flatDmg','armorPct','speedPct']);
function heroDiff(a,b){ // a — сейчас, b — после
  const rows=[];const P=(n,x,y,dec,suf,inv)=>{x=+x.toFixed(dec);y=+y.toFixed(dec);if(x===y)return;const d=y-x;const good=inv?d<0:d>0;
    const pct=x?` (${d>0?'+':''}${Math.round(d/x*100)}%)`:'';rows.push(`<tr><td>${n}</td><td>${x}${suf}</td><td>${y}${suf}</td><td class="${good?'up':'bad'}">${good?'▲':'▼'}${pct||Math.abs(+d.toFixed(dec))}</td></tr>`);};
  P('⚔ Урон в секунду',a.dps,b.dps,1,'');P('⚔ Урон удара',a.p.dmg,b.p.dmg,1,'');P('⏱ Удар раз в',a.p.speed/1000,b.p.speed/1000,2,'с',true);
  P('❤ Здоровье',a.p.hp,b.p.hp,0,'');P('🛡 Броня',a.p.armor,b.p.armor,0,'');P('✦ Шанс крита',a.p.crit,b.p.crit,1,'%');P('💧 Мана',a.p.mana,b.p.mana,0,'');P('♥ Реген',a.p.regen,b.p.regen,2,'/с');
  const RN={fire:'🔥 Огонь',ice:'❄ Лёд',shock:'⚡ Молния',poison:'☠ Яд',dark:'◐ Тьма'};for(const k in RN)P(RN[k],a.p.res[k],b.p.res[k],0,'%');
  const ks=new Set([...Object.keys(a.m.skill||{}),...Object.keys(b.m.skill||{})]);for(const s of ks)P('+ур. '+SK[s].n,(a.m.skill||{})[s]||0,(b.m.skill||{})[s]||0,0,'');
  const all=new Set([...Object.keys(a.m),...Object.keys(b.m)]);let other=0;
  for(const k of all){if(SHOWN_K.has(k))continue;const x=a.m[k],y=b.m[k];if(typeof x==='object'||typeof y==='object')continue;if((x||0)===(y||0))continue;
    if(MOD_N[k])P(MOD_N[k],x||0,y||0,1,typeof x==='number'&&k.endsWith('Pct')||/OnHit|lifesteal|thorns|Speed|Xp|Loot/.test(k)?'%':'');else other++;}
  const ua=(a.m.uAbil||[]).join(),ub=(b.m.uAbil||[]).join();if(ua!==ub){for(const id of b.m.uAbil||[])if(!(a.m.uAbil||[]).includes(id))rows.push(`<tr><td colspan="4" class="up">+ способность «${ABL[id].n}»</td></tr>`);for(const id of a.m.uAbil||[])if(!(b.m.uAbil||[]).includes(id))rows.push(`<tr><td colspan="4" class="bad">− способность «${ABL[id].n}»</td></tr>`);}
  if(other)rows.push(`<tr><td colspan="4" class="sub">…и ещё ${other} особых свойств</td></tr>`);
  if(a.p.dmgSk!==b.p.dmgSk)rows.unshift(`<tr><td colspan="4" class="gold">Стиль боя сменится: ${SK[a.p.dmgSk].n} → ${SK[b.p.dmgSk].n}</td></tr>`);
  return rows;}
function verdict(a,b){const dd=a.dps?(b.dps-a.dps)/a.dps:0,dh=a.p.hp?(b.p.hp-a.p.hp)/a.p.hp:0,da=(b.p.armor-a.p.armor)/Math.max(20,a.p.armor);const s=dd*1.2+dh*0.8+da*0.4;
  if(s>0.02)return '<span class="up">▲ Лучше надетого</span>';if(s<-0.02)return '<span class="bad">▼ Хуже надетого</span>';return '<span class="sub">≈ Боевые статы почти равны</span>';}
function cmpTable(rows,h1,h2){return rows.length?`<table class="cmp"><tr><th></th><th>${h1}</th><th>${h2}</th><th></th></tr>${rows.join('')}</table>`:'<div class="sub">Характеристики героя не изменятся.</div>';}

function itemDesc(it){

  if(it.dmg)h+=`<div>Урон: <b>${it.dmg}</b>${base(it.dmg)} · удар раз в ${(WEAP[it.wt].spd/1000).toFixed(1)}с · ${SK[WEAP[it.wt].sk].n}</div>`;

function itemRows(it){const r={};if(it.dmg)r['Урон']=it.dmg;if(it.arm)r['Броня']=it.arm;if(it.dmg)r['Удар раз в, с']=+(WEAP[it.wt].spd/1000).toFixed(1);

  return ks.map(k=>{const x=A[k],y=B[k];let d='';if(typeof x==='number'||typeof y==='number'){const v=+(((x||0)-(y||0)).toFixed(1));const inv=k.startsWith('Удар раз');if(v)d=`<span class="${(inv?v<0:v>0)?'up':'bad'}">${v>0?'+':''}${v}</span>`;}
    return `<tr><td>${k}</td><td>${x===undefined?'—':x}</td><td>${y===undefined?'—':y}</td><td>${d}</td></tr>`;});}

// ---------- превью заточки ----------
function upgPreview(it){const u=it.up||0;if(u>=10)return '';const L=[];
  if(it.dmg)L.push(`Урон <b>${it.dmg}</b> → <b class="up">${(it.dmg*UPG_K).toFixed(1)}</b>`);if(it.arm)L.push(`Броня <b>${it.arm}</b> → <b class="up">${(it.arm*UPG_K).toFixed(1)}</b>`);

// Схема: сейв режется на куски по 4000 символов в один из двух слотов (a/b), затем пишется манифест ap_meta.
// Манифест пишется последним, поэтому недописанный сейв никогда не будет прочитан.
const CLOUD={busy:false,slot:null,checking:false,hiddenAt:0,last:null};
function devId(){try{let d=localStorage.getItem('ap_dev');if(!d){d=Math.random().toString(36).slice(2,10);localStorage.setItem('ap_dev',d);}return d;}catch(e){return 'nodev';}}
function cs(fn,...a){return new Promise((res,rej)=>{try{Telegram.WebApp.CloudStorage[fn](...a,(e,v)=>e?rej(e):res(v));}catch(e){rej(e);}});}
function fnv(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(36);}
function saveSum(s){let tl=0;for(const k in s.skills)tl+=levelFromXp(s.skills[k]);return {lv:tl,gold:Math.floor(s.gold||0),layer:s.unlockedLayer||1,play:(s.st&&s.st.playMs)||0};}
async function cloudMeta(){const raw=await cs('getItem','ap_meta');if(!raw)return null;try{return JSON.parse(raw);}catch(e){return null;}}
async function cloudPush(silent){
  if(!tgCloud()||CLOUD.busy||S.challenge)return false;CLOUD.busy=true;
  try{const data=exportSave();const old=await cloudMeta().catch(()=>null);const slot=old&&old.slot==='a'?'b':'a';
    const parts=[];for(let i=0;i<data.length;i+=4000)parts.push(data.slice(i,i+4000));
    for(let i=0;i<parts.length;i+=6)await Promise.all(parts.slice(i,i+6).map((p,j)=>cs('setItem','ap'+slot+(i+j),p)));
    const t=Date.now();const meta=Object.assign({v:2,slot,n:parts.length,len:data.length,h:fnv(data),t,dev:devId(),last:S.last},saveSum(S));
    await cs('setItem','ap_meta',JSON.stringify(meta));S.cloudAt=t;CLOUD.last=meta;
    if(old&&old.slot===slot)/*не должно случаться*/0;
    if(!silent)toast('☁ Сохранено в облако Telegram');return true;}
  catch(e){if(!silent)toast('Облако: не удалось сохранить ('+(e&&e.message||e)+')');return false;}
  finally{CLOUD.busy=false;}}
async function cloudPull(meta){
  meta=meta||await cloudMeta();
  if(!meta){const n=+(await cs('getItem','ap_n').catch(()=>0));if(!n)return null;const keys=Array.from({length:n},(_,i)=>'ap_'+i);const v=await cs('getItems',keys);return {data:keys.map(k=>v[k]||'').join(''),meta:{t:0,legacy:1}};}

// главная проверка: есть ли в облаке более свежий сейв с другого устройства
async function cloudCheck(reason){
  if(!tgCloud()||CLOUD.checking||CLOUD.busy||S.challenge)return;CLOUD.checking=true;
  try{const meta=await cloudMeta();
    let m=meta;
    if(!meta){const r=await cloudPull(null).catch(()=>null);let ls=null;try{ls=r&&saveSum(importSave(r.data));}catch(e){}
      if(!ls||ls.play<=saveSum(S).play+60e3){await cloudPush(true);return;}m=Object.assign({t:0,legacy:1},ls);}
    if(meta&&meta.dev===devId()&&meta.t<=(S.cloudAt||0)+2000)return;            // последнюю копию писали мы
    if(meta&&meta.t<=(S.cloudAt||0))return;                                        // эту копию мы уже видели
    const loc=saveSum(S);const bootLast=window.BOOT_LAST||0;

    const untouched=(reason==='boot'&&(window.BOOT_FRESH||S.cloudAt>0&&bootLast<=S.cloudAt+150e3))||(reason==='resume'&&S.cloudAt>=CLOUD.hiddenAt-5000);
    if(untouched&&m.play>=loc.play-60e3){if(!meta){const r=await cloudPull(null);applyCloud(r.data,{t:Date.now()});return;}const r=await cloudPull(meta);applyCloud(r.data,r.meta);return;}
    const cloudBetter=(m.play||0)>loc.play||(!S.cloudAt&&m.lv>loc.lv);
    CLOUD.pend=m;
    modal(`<h3>☁ Сейв с другого устройства</h3><div class="sub">В облаке Telegram есть прогресс, сохранённый на другом устройстве после последней синхронизации этого. Выбери, какой оставить — второй будет заменён.</div>
      ${sumHtml('В облаке'+(m.legacy?'':' · другое устройство'),m,m.t,cloudBetter)}${sumHtml('На этом устройстве',loc,bootLast||S.last,!cloudBetter)}
      <button class="big ${cloudBetter?'gold':''}" data-a="cloudTake">Загрузить из облака${cloudBetter?' (рекомендуется)':''}</button><button class="${cloudBetter?'':'gold'}" data-a="cloudKeep">Оставить этот и отправить в облако</button>`);}
  catch(e){if(reason==='manual')toast('Облако недоступно: '+(e&&e.message||e));}

  if(rep.gold)h+=`<div class="sub">Золото: +${fmt(rep.gold)}</div>`;

  const ld=$('#loading');
  await tgInject();
  try{if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();tgSetup();try{Telegram.WebApp.setHeaderColor('#0a0a0c');Telegram.WebApp.setBackgroundColor('#0a0a0c');}catch(e){}}}catch(e){}
  await idbOpen();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});}catch(e){}
  const loaded=await loadGame();
  window.BOOT_FRESH=!loaded;window.BOOT_LAST=loaded?(loaded.last||0):0;S=loaded||newState(); if(!loaded)starterKit();
  else{ // миграция старых сейвов: низкоуровневые вещи без требований + стартовые лук и посох
    const all=[...S.inv,...S.bank,...Object.values(S.eq)].filter(Boolean);all.forEach(it=>{if(it.ilvl<=10)it.req=1;});
    const has=wt=>all.some(it=>it.wt===wt);
    if(!has('bow')){const i=invFree();if(i>=0){const it=makeItem('weapon','bow',2,0,'drop');it.n='Старый охотничий лук';S.inv[i]=it;}}
    if(!has('staff')){const i=invFree();if(i>=0){const it=makeItem('weapon','staff',2,0,'drop');it.n='Посох послушника';S.inv[i]=it;}}}
  recalcMods(); applyNotif(); applyView(); ensureQuests();
  $('#rG').innerHTML=icon('gold')+'<b id="tGold"></b>';$('#rC').innerHTML=icon('crystal')+'<b id="tCr"></b>';
  $('#rE').innerHTML=icon('echo')+'<b id="tEcho"></b>';$('#rT').innerHTML=icon('tear')+'<b id="tTear"></b>';
  const NI={town:'nav_town',skills:'nav_skills',combat:'sword',inv:'nav_inv',more:'nav_more'};
  document.querySelectorAll('#nav button').forEach(b=>b.insertAdjacentHTML('afterbegin',icon(NI[b.dataset.n])));
  for(const a of ABILITIES){if(a.uniq||!canUseAbil(a)||S.abil.includes(a.id))continue;const i=S.abil.findIndex((x,j)=>!x&&j<abilSlots());if(i<0)break;S.abil[i]=a.id;}
  let rep=null;
  if(loaded){const ms=Date.now()-(S.last||Date.now());if(ms>60e3){ld.querySelector('p').textContent='Пока тебя не было, пепел не спал… считаю '+fmtT(Math.min(ms,offlineCapH()*3600e3)/1000)+' прогресса';await new Promise(r=>setTimeout(r,60));}
    try{rep=runOffline(Date.now()-S.last);}catch(e){reportError(e);}}
  S.last=Date.now();
  nav('town');
  const wait=Math.max(0,1300-(performance.now()-BOOT_T0));await new Promise(r=>setTimeout(r,wait));
  ld.classList.add('out');setTimeout(()=>ld.remove(),600);
  if(!loaded)intro();
  else{if(rep)offlineReport(rep);
    if(!S.tut){S.tut={cur:null,step:0,done:{},off:false,min:false,cx:{},paused:true};
      if(!rep)modal(`<div class="intro"><h3>Новое: обучение</h3><p>В игре появилось подробное обучение по каждой механике и Справочник в Меню.</p><button class="big gold" data-a="tutAll">Пройти обучение с начала</button><button class="big" data-a="closeModal">Только подсказки о новом</button><button class="big" data-a="tutOffGo">Без обучения</button></div>`);}}
  if(LOAD_NOTE)setTimeout(()=>bigToast(LOAD_NOTE),800);
  let canLS=false;try{localStorage.setItem('ap_t','1');canLS=localStorage.getItem('ap_t')==='1';localStorage.removeItem('ap_t');}catch(e){}
  if(!canLS&&!IDB.db)setTimeout(()=>bigToast('Внимание: браузер запрещает сохранение. Используй Экспорт в Настройках.'),1500);
  tutRender();
  setInterval(loop,100); requestAnimationFrame(frame);
  addEventListener('pagehide',saveGame); document.addEventListener('visibilitychange',()=>{if(document.hidden)saveGame();});
  pwaRegister();
}
boot().catch(e=>{reportError(e);try{if(!S){S=newState();starterKit();recalcMods();}}catch(x){}
  const ld=document.getElementById('loading');if(ld)ld.remove();
  try{nav('town');setInterval(loop,100);requestAnimationFrame(frame);}catch(x){}
  try{modal(`<h3>Не удалось полностью запустить игру</h3><div class="sub">Попробуй перезапустить. Если повторится — отправь отчёт разработчику.</div><button data-a="bugReport">Собрать отчёт</button>`);}catch(x){}});

</script></body></html>
